<!doctype html>
<html><body style="font-family:system-ui,sans-serif;max-width:32rem;margin:2rem auto;color:#222">
<p>Hi {{.Username}},</p>
<p>Someone asked to reset the password for your {{.SiteName}} account.</p>
<p><a href="{{.Link}}" style="display:inline-block;padding:.6rem 1.2rem;background:#3b5bdb;color:#fff;border-radius:6px;text-decoration:none">Choose a new password</a></p>
<p style="color:#666;font-size:.9rem">The link expires in {{.ExpiresIn}} and can be used once. Resetting signs you out everywhere. If this wasn't you, ignore this email; your password has not changed.</p>
</body></html>
