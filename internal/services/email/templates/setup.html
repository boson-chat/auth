<!doctype html>
<html><body style="font-family:system-ui,sans-serif;max-width:32rem;margin:2rem auto;color:#222">
<p>Hi {{.Username}},</p>
<p>An administrator created a {{.SiteName}} account for you with the username <strong>{{.Username}}</strong>.</p>
<p><a href="{{.Link}}" style="display:inline-block;padding:.6rem 1.2rem;background:#3b5bdb;color:#fff;border-radius:6px;text-decoration:none">Choose your password</a></p>
<p style="color:#666;font-size:.9rem">The link expires in {{.ExpiresIn}} and can be used once. If you weren't expecting this, you can ignore this email.</p>
</body></html>
