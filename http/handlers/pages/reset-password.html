<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password</title>
<link rel="stylesheet" href="/assets/pages.css">
</head>
<body data-page="reset">
<main>
  <h1>Choose a new password</h1>
  <form id="reset">
    <label for="pw">New password</label>
    <input id="pw" name="pw" type="password" autocomplete="new-password" minlength="10" maxlength="256" required>
    <label for="pw2">Repeat it</label>
    <input id="pw2" name="pw2" type="password" autocomplete="new-password" minlength="10" maxlength="256" required>
    <button type="submit">Set password</button>
  </form>
  <p id="status" role="status"></p>
</main>
<script src="/assets/pages.js"></script>
</body>
</html>
