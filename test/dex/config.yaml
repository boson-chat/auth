# Dex for the OIDC end-to-end test (make test-dex-up; TEST_DEX_ISSUER).
# The redirect URI matches PUBLIC_URL in test/integration (the test rewrites
# the host to its local server when following the redirect).
issuer: http://127.0.0.1:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
enablePasswordDB: true
staticPasswords:
  - email: dex.user@example.com
    # bcrypt of "dex-password"
    hash: "$2a$10$Vpgqhh.fkZHYp.MPsXgkUORyBMlQnARM72oJVlpeUFSsuXDQsUjCG"
    username: dexuser
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
staticClients:
  - id: boson-auth
    secret: boson-auth-secret
    name: boson auth
    redirectURIs:
      - http://auth.integration.test/v1/sso/dex/callback
