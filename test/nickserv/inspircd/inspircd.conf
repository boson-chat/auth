# InspIRCd 4 test fixture for the Anope network. Test only.
<define name="networkDomain" value="anope.test">
<server name="irc.anope.test" description="Anope test IRCd" network="AnopeTest" id="1AA">
<admin name="Test" nick="test" email="test@anope.test">

<bind address="" port="6667" type="clients">
<bind address="" port="6697" type="clients" sslprofile="clients">
<bind address="" port="7000" type="servers">

<module name="ssl_gnutls">
<sslprofile name="clients" provider="gnutls" certfile="conf/cert.pem" keyfile="conf/key.pem" hash="sha256">

# Every check comes from one address (the tests): no clone or flood limits.
<connect name="main" allow="*" timeout="20" pingfreq="120" hardsendq="1M" softsendq="65536"
         recvq="65536" threshold="1000" commandrate="100000" fakelag="no" localmax="1000"
         globalmax="1000" maxconnwarn="no" resolvehostnames="no" useident="no" limit="5000">

<options prefixquit="Quit: " syntaxhints="yes" allowzerolimit="no">
<security hideserver="" userstats="Pu" announceinvites="dynamic" hidesplits="no" maxtargets="20">
<performance netbuffersize="10240" somaxconn="128" softlimit="12800" quietbursts="yes">
<log method="file" type="* -USERINPUT -USEROUTPUT" level="normal" target="/dev/stdout">

<module name="spanningtree">
<link name="services.anope.test" ipaddr="anope" port="7000" allowmask="*"
      sendpass="linkpass-anope" recvpass="linkpass-anope">
<services server="services.anope.test" silent="yes">

<module name="account">
<module name="services">
<module name="sasl">
<sasl target="services.anope.test" requiressl="no">
<module name="cap">
<module name="ircv3">
<module name="ircv3_accounttag">
<module name="ircv3_capnotify">
<module name="chghost">
<module name="chgident">
<module name="chgname">
<module name="svshold">
<module name="servprotect">
<module name="globops">
<module name="hidechans">
<module name="topiclock">
<module name="namesx">
<module name="uhnames">
