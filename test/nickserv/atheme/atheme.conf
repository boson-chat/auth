/* Atheme 7.2 test fixture: links to the ngircd "atheme-ircd". Test only. */
loadmodule "modules/protocol/ngircd";
loadmodule "modules/backend/opensex";
loadmodule "modules/crypto/pbkdf2v2";

loadmodule "modules/nickserv/main";
loadmodule "modules/nickserv/help";
loadmodule "modules/nickserv/identify";
loadmodule "modules/nickserv/info";
loadmodule "modules/nickserv/logout";
loadmodule "modules/nickserv/register";
loadmodule "modules/nickserv/verify";
loadmodule "modules/nickserv/freeze";
loadmodule "modules/nickserv/set_core";
loadmodule "modules/nickserv/set_email";

loadmodule "modules/saslserv/main";
loadmodule "modules/saslserv/plain";

loadmodule "modules/misc/httpd";
loadmodule "modules/transport/jsonrpc";
loadmodule "modules/transport/xmlrpc";

serverinfo {
	name = "services.atheme.test";
	desc = "Atheme test services";
	numeric = "00A";
	recontime = 5;
	netname = "AthemeTest";
	hidehostsuffix = "users.atheme.test";
	adminname = "Test";
	adminemail = "admin@atheme.test";
	registeremail = "noreply@atheme.test";
	mta = "/usr/local/bin/fake-mta";
	/* Registration needs the emailed key (NickServ VERIFY REGISTER). */
	auth = email;
	casemapping = rfc1459;
	loglevel = { admin; error; info; network; wallops; };
	maxlogins = 10;
	maxusers = 0;
	maxnicks = 5;
	maxchans = 5;
	mdlimit = 30;
	emaillimit = 1000;
	emailtime = 60;
};

uplink "irc.atheme.test" {
	host = "atheme-ircd";
	port = 6667;
	send_password = "linkpass-atheme";
	receive_password = "linkpass-atheme";
};

nickserv {
	nick = "NickServ";
	user = "NickServ";
	host = "services.atheme.test";
	real = "Nickname Services";
	spam = no;
	no_nick_ownership = no;
	expire = 0;
	enforce_expire = 14;
	enforce_delay = 30;
	enforce_prefix = "Guest";
	waitreg_time = 0;
	maxnicklen = 30;
};

saslserv {
	nick = "SaslServ";
	user = "SaslServ";
	host = "services.atheme.test";
	real = "SASL Authentication Agent";
};

httpd {
	host = "0.0.0.0";
	port = 8080;
};

general {
	permissive_mode = no;
	helpchan = "#help";
	helpurl = "http://example.invalid/help";
	verbose_wallops = no;
	join_chans = no;
	leave_chans = no;
	uflags = { hidemail; };
	cflags = { guard; verbose; };
	raw = no;
	flood_msgs = 0;
	flood_time = 0;
	ratelimit_uses = 0;
	ratelimit_period = 0;
	vhost_change = 0;
	kline_time = 7;
	commit_interval = 1;
	operstring = "is an IRC Operator";
	servicestring = "is a Network Service";
	default_clone_allowed = 1000;
	default_clone_warn = 1000;
	clone_time = 0;
	show_entity_id = yes;
	load_database_mdeps = yes;
	immune_level = immune;
};

language { name = "en"; };
