/*
 * Anope 2.1 test fixture: links to the "anope-ircd" InspIRCd 4 and serves
 * JSON-RPC (rpc_user: anope.checkCredentials, rpc_data: anope.account) on
 * :8080 inside the compose network. Test only, never a production config.
 */
define { name = "services.host"; value = "services.anope.test" }

uplink
{
	host = "anope-ircd"
	protocol = "ipv4"
	ssl = no
	port = 7000
	password = "linkpass-anope"
}

serverinfo
{
	name = "${services.host}"
	id = "00A"
	description = "Anope test services"
	pid = "data/anope.pid"
	motd = "conf/motd.txt"
}

module { name = "inspircd" }

networkinfo
{
	networkname = "AnopeTest"
	nicklen = 31
	userlen = 10
	hostlen = 64
	chanlen = 32
	allow_undotted_vhosts = no
	disallow_start_or_end = ".-/"
}

options
{
	casemap = "ascii"
	/* The tests try wrong passwords on purpose: don't kill the checker. */
	badpasslimit = 0
	updatetimeout = 2m
	expiretimeout = 30m
	readtimeout = 5s
	timeoutcheck = 3s
	retrywait = 5s
	hideprivilegedcommands = yes
	hideregisteredcommands = yes
	didyoumeandifference = 4
	codelength = 15
	linelength = 100
}

/* nickserv.example.conf with the Dockerfile's test overrides: no
 * registration delays, registration = "none". */
include { type = "file"; name = "nickserv.conf" }

log
{
	target = "services.log"
	bot = ""
	logage = 1
	admin = "*"
	override = "*"
	commands = "*"
	servers = "*"
	users = ""
	other = "*"
}

mail { usemail = no }

module { name = "db_json"; database = "anope.json" }
module { name = "enc_bcrypt" }

module
{
	name = "httpd"
	httpd
	{
		name = "httpd/main"
		ip = "0.0.0.0"
		port = 8080
		timeout = 30
	}
}

module
{
	name = "jsonrpc"
	server = "httpd/main"
	token
	{
		token = "anope-rpc-token"
		methods = "anope.checkCredentials anope.account"
	}
}
module { name = "rpc_user" }
module { name = "rpc_data" }
