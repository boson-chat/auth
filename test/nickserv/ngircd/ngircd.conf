# ngircd test fixture for the Atheme network. Test only.
[Global]
	Name = irc.atheme.test
	Info = Atheme test IRCd
	Network = AthemeTest
	Ports = 6667
	PidFile = /tmp/ngircd.pid

[Limits]
	MaxConnectionsIP = 0
	MaxJoins = 0
	PingTimeout = 120
	PongTimeout = 60

[Options]
	DNS = no
	Ident = no
	PAM = no
	OperCanUseMode = yes
	CloakHost = %x.users.atheme.test
	CloakHostSalt = auth-nickserv-test

[SSL]
	CertFile = /certs/irc.pem
	KeyFile = /certs/irc.key
	Ports = 6697

[Server]
	Name = services.atheme.test
	MyPassword = linkpass-atheme
	PeerPassword = linkpass-atheme
	Passive = yes
	ServiceMask = *Serv,Global
