# On every push to main: semantic-release reads the conventional commits since
# the last tag (feat → minor, fix/perf/refactor/build → patch). If there is a
# release, it tags vX.Y.Z, creates the GitHub release, and builds + pushes
# ghcr.io/boson-chat/auth:<version> and :latest (linux/amd64 + linux/arm64).
#
# Uses only GITHUB_TOKEN (packages: write); no registry secrets needed.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  IMAGE: ghcr.io/boson-chat/auth

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth-ci
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://auth:auth-ci@localhost:5432/auth?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release
