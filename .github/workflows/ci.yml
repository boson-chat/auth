name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth-ci
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Integration tests create a throwaway database per test from this one.
      TEST_DATABASE_URL: postgres://auth:auth-ci@localhost:5432/auth?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Docker build
        run: docker build --build-arg VERSION=ci -t auth:ci .
