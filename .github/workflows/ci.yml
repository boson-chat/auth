name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth-ci
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Integration tests create a throwaway database per test from this one.
      TEST_DATABASE_URL: postgres://auth:auth-ci@localhost:5432/auth?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Compiled email layout (and default MJML) match layout.mjml
        run: |
          go generate ./internal/services/email/
          git diff --exit-code -- internal/services/email/templates/compiled internal/services/email/testdata/default-mjml
          test -z "$(git status --porcelain -- internal/services/email/templates/compiled internal/services/email/testdata/default-mjml)" || (git status --porcelain; exit 1)
      - name: Server binary does not link MJML
        run: '! go list -deps ./cmd/... | grep -i -E "mjml|wazero"'
      - name: Start Dex (real OIDC provider for TestOIDCAgainstDex)
        run: |
          docker run -d --name dex -p 127.0.0.1:5556:5556 \
            -v "$PWD/test/dex/config.yaml:/etc/dex/config.yaml:ro" ghcr.io/dexidp/dex:v2.44.0 dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5556/dex/.well-known/openid-configuration >/dev/null && exit 0; sleep 1; done
          docker logs dex; exit 1
      - run: go test -race -count=1 ./...
        env:
          TEST_DEX_ISSUER: http://127.0.0.1:5556/dex
      - name: Docker build
        run: docker build --build-arg VERSION=ci -t auth:ci .

  # The NickServ account backend against real services and IRC servers
  # (test/nickserv/compose.yaml): Anope 2.1 + InspIRCd 4 (anope_rpc, sasl,
  # identify), Atheme 7.2 + ngircd 27 (atheme_jsonrpc, atheme_xmlrpc, identify).
  nickserv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the fixtures
        run: docker compose -p auth-nickserv-test -f test/nickserv/compose.yaml up -d --build
      - run: go test -race -count=1 -v ./test/nickserv/
        env:
          TEST_NICKSERV: "1"
      - name: Fixture logs
        if: failure()
        run: docker compose -p auth-nickserv-test -f test/nickserv/compose.yaml logs --no-color
      - name: Stop the fixtures
        if: always()
        run: docker compose -p auth-nickserv-test -f test/nickserv/compose.yaml down -v --remove-orphans
